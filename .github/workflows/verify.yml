name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Formatting / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Check supported file formatting
        run: npm run check

  toolchain:
    name: Read firmware SDK pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      esp_idf: ${{ steps.pin.outputs.esp_idf }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read SDK version
        id: pin
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("toolchain.json").read_text())["esp_idf"]
          if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("toolchain.json must pin a numeric ESP-IDF release")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"esp_idf={version}\n")
          PY

  firmware:
    name: ESP32-S3 camera/preview firmware and host tests
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v${{ needs.toolchain.outputs.esp_idf }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile firmware without device access
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware build
      - name: Run camera and preview boundary tests on the host
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cmake -S tests/host -B .cache/host-tests -G Ninja
          cmake --build .cache/host-tests
          ctest --test-dir .cache/host-tests --output-on-failure
